---
layout: default
---


<div class="row g-5 mb-5">  
  <div class="col-md-6">
    <h3 class="fw-bold">Research</h3>
    {{ content }}
  </div>  
  <div class="col-md-6">
    <img src="{{ site.github.url }}/assets/img/logo.png" alt="logo" width="90%" style="padding-left: 15%; padding-right:15%">
  </div>
</div>

{% include publications.html %}

<div class="row g-5 mb-5">
  <div class="col-md-12">
    <h3 class="fw-bold border-bottom pb-3 mb-5">Updates</h3>
    {% for post in site.posts %}
      <h5>{{ post.date | date: "%B %Y" }}</h5> <p>{{ post.content }}</p>
    {% endfor %}
  </div>
</div>
